# Ao subir uma tag v* (ex.: v1.2.1), compila o ClaudeWidget.exe no Windows e publica na página de Releases,
# com as novidades daquela versão tiradas do NOVIDADES.md.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compilar
        shell: powershell
        run: .\build.ps1

      - name: Montar o zip com o instalador
        shell: powershell
        run: Compress-Archive -Path dist\ClaudeWidget.exe, instalar.ps1, desinstalar.ps1, README.md, LICENSE -DestinationPath ClaudeWidget.zip

      - name: Escrever as notas da versão
        shell: powershell
        run: |
          $novidades = [IO.File]::ReadAllText('NOVIDADES.md', [Text.Encoding]::UTF8)
          $versao = [regex]::Escape($env:GITHUB_REF_NAME)
          $trecho = [regex]::Match($novidades, '(?ms)^## ' + $versao + '\s*$(.*?)(?=^## |\z)')
          $notas = if ($trecho.Success) { $trecho.Groups[1].Value.Trim() } else { '' }
          $baixar = [IO.File]::ReadAllText('.github\como-baixar.md', [Text.Encoding]::UTF8)
          [IO.File]::WriteAllText('notas.md', "## Novidades`n`n$notas`n`n$baixar", (New-Object Text.UTF8Encoding($false)))

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ClaudeWidget.exe
            ClaudeWidget.zip
          body_path: notas.md
